name: Nightly Manufacturer Cleanup

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      max_asset_count:
        description: 'Maximum number of assets to process (default: 2000)'
        required: false
        type: string
        default: '2000'

env:
  BLENDERKIT_SERVER: "https://www.blenderkit.com"
  BLENDERKIT_API_KEY: ${{ secrets.BLENDERKIT_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  MAX_ASSET_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_asset_count || '2000' }}
  SKIP_UPDATE: false

jobs:
  clean-bulk:
    name: Clean manufacturer tags (nightly bulk)
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ai.txt
      - name: Report available AI provider secrets
        run: |
          echo "DEEPSEEK_API_KEY set: ${{ secrets.DEEPSEEK_API_KEY != '' }}"
          echo "XAI_API_KEY set: ${{ secrets.XAI_API_KEY != '' }}"
          echo "OPENAI_API_KEY set: ${{ secrets.OPENAI_API_KEY != '' }}"
      - name: Clean manufacturer tags (nightly)
        run: |
          {
            echo "## Manufacturer cleanup report card"
            echo ""
            echo "- **Status:** cleanup step started"
            echo "- **Max asset count:** ${MAX_ASSET_COUNT}"
          } > "$GITHUB_STEP_SUMMARY"
          python clean_manufacturer_tags.py
