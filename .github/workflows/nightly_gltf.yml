name: nightly GLTF

# Superseded by nightly_process.yml for scheduled runs; kept for manual reruns.
on:
  workflow_dispatch:

env:
  BLENDERKIT_SERVER: 'https://www.blenderkit.com'
  BLENDERKIT_API_KEY: '${{ secrets.BLENDERKIT_API_KEY }}'
  BLENDER_PATH: '/home/headless/blender/blender'
  MAX_ASSET_COUNT: 200

jobs:
  GLTF:
    # On ubuntu-26.04 runners setup-python's Python cannot load ssl inside this container (pip finds no packages, 7 Nov 2026).
    runs-on: ubuntu-24.04
    container: ghcr.io/blenderkit/headless-blender:blender-5.0 # LATEST STABLE
    steps:
      - uses: actions/checkout@v4
      - name: Install lsb-release
        run: apt-get update && apt-get install -y lsb-release python3-pip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: Generate GLTFs
        run: python3 generate_gltf.py
