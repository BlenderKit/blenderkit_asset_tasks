name: nightly RESOLUTIONS

# Superseded by nightly_process.yml for scheduled runs; kept for manual reruns.
on:
  workflow_dispatch:

env:
  BLENDERKIT_SERVER: 'https://www.blenderkit.com'
  BLENDERKIT_API_KEY: '${{ secrets.BLENDERKIT_API_KEY }}'
  BLENDER_PATH: '/home/headless/blender/blender'
  BLENDERS_PATH: '/home/headless/blenders'
  MAX_ASSET_COUNT: 200

jobs:
  RESOLUTIONS:
    # The multi-version image does not fit the disk of ubuntu-26.04 runners ("no space left on device" while pulling, 3 Nov 2026).
    runs-on: ubuntu-24.04
    # Multi-version image so resolutions open each asset with its matching
    # (never newer) Blender instead of always the latest.
    container: ghcr.io/blenderkit/headless-blender:multi-version
    steps:
      - uses: actions/checkout@v4
      - name: Install lsb-release
        run: apt-get update && apt-get install -y lsb-release python3-pip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: Generate resolutions
        run: python3 generate_resolutions.py
